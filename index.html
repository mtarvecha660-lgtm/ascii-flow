const c=document.getElementById("c"),g=c.getContext("2d");
const COLS=170,ROWS=56;
const RAMP=" .':-~=+*x#%@&$",NOISE="@#%&$*x!=+;:-~.' ".split("");
const LOOP=16.0, STAG=2.6, WAVE=2.2;
const EYE=[[0,[30,17,10]],[0.15,[70,32,14]],[0.35,[150,66,20]],[0.55,[215,112,34]],[0.75,[250,175,80]],[1,[255,238,200]]];
const HEART=[[0,[40,7,14]],[0.3,[110,18,40]],[0.55,[190,35,70]],[0.8,[240,95,125]],[1,[255,175,195]]];

const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function col(b,s){for(let i=0;i<s.length-1;i++){if(b<=s[i+1][0]){const t=(b-s[i][0])/(s[i+1][0]-s[i][0]);return [s[i][1][0]+(s[i+1][1][0]-s[i][1][0])*t,s[i][1][1]+(s[i+1][1][1]-s[i][1][1])*t,s[i][1][2]+(s[i+1][1][2]-s[i][1][2])*t]}}return s[s.length-1][1]}
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};

let v=d[i*4]/255;v=Math.pow(clamp((v-0.02)/0.98,0,1),1.2);eb[i]=Math.min(1,v*1.5);

function loop(ts){if(t0===null)t0=ts;const t=(ts-t0)/1000;
const W=innerWidth,H=innerHeight;const s=Math.min(W/1280,H/720);const VW=1280*s,VH=720*s,ox=(W-VW)/2,oy=(H-VH)/2;
g.fillStyle="#040303";g.fillRect(0,0,W,H);

g.font=`${Math.max(6,(cw*1.62)|0)}px 'DejaVu Sans Mono',Consolas,monospace`;g.textBaseline="top";
const cyc=(t%LOOP)/LOOP; const ph=cyc<0.5?cyc*2:2-cyc*2;   // ping-pong 0->1->0
for(let r=0;r<ROWS;r++)for(let x=0;x<COLS;x++){const i=r*COLS+x;
const on=clamp(off[i]/STAG/1.08,0,1);
const p=smooth((ph-on*0.55)/0.45);
const w=p; // 0=eye 1=heart
let b=eb[i]*(1-w)+hb[i]*w;
b+=0.035*Math.sin(t*2.6+fl[i]);          // liquid shimmer
const wall=0.035*(1-w*0.3);
if(b<wall){g.fillStyle="rgba(46,26,14,0.55)";g.fillText(RAMP[1],ox+x*cw,oy+r*ch);continue}
if(b<0.02)continue;
const cc1=col(clamp(b,0,1),EYE),cc2=col(clamp(b,0,1),HEART);
const cr=cc1[0]+(cc2[0]-cc1[0])*w,cg=cc1[1]+(cc2[1]-cc1[1])*w,cb=cc1[2]+(cc2[2]-cc1[2])*w;
g.fillStyle=`rgb(${cr|0},${cg|0},${cb|0})`;
g.fillText(ci(b),ox+x*cw,oy+r*ch)}
